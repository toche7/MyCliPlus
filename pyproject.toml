[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-cli-plus"
version = "0.1.0"
description = "A modular terminal AI agent inspired by BasicHarness5_MyCLI_Plus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
]

[project.scripts]
mycli-plus = "mycli_plus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

